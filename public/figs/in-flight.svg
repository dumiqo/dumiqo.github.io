<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="fig-title fig-desc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="fig-title">Requests in flight against a pool of 100 connections</title>
  <desc id="fig-desc">Log-scale bars: 2,000 requests per second at 10 ms needs 20 connections in flight; 2,000 at 100 ms needs 200; 200,000 at 10 ms needs 2,000. The dashed line marks 100 connections, the Postgres default.</desc>

  <style>
    /* The SVG is loaded through an &lt;img&gt;, so it cannot inherit the page's CSS variables.
       It reads the same preference the site does and carries the site's own palette. */
    .fg { fill: #1a1a1a; }
    .muted { fill: #6b6862; }
    .bar { fill: #2f5d50; fill-opacity: 0.55; }
    .grid { stroke: #1a1a1a; stroke-opacity: 0.16; }
    .axis { stroke: #1a1a1a; stroke-opacity: 0.45; }
    .dash { stroke: #1a1a1a; stroke-opacity: 0.8; }
    .value { fill: #1a1a1a; font-weight: 600; }

    @media (prefers-color-scheme: dark) {
      .fg { fill: #ecebe6; }
      .muted { fill: #9a968c; }
      .bar { fill: #86c7ab; fill-opacity: 0.6; }
      .grid { stroke: #ecebe6; stroke-opacity: 0.16; }
      .axis { stroke: #ecebe6; stroke-opacity: 0.45; }
      .dash { stroke: #ecebe6; stroke-opacity: 0.8; }
      .value { fill: #ecebe6; }
    }
  </style>

  <g class="grid" stroke-width="1">
    <line x1="90" y1="20" x2="90" y2="250"/>
    <line x1="360" y1="20" x2="360" y2="250"/>
    <line x1="630" y1="20" x2="630" y2="250"/>
  </g>

  <line x1="360" y1="16" x2="360" y2="256" class="dash" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="366" y="14" class="fg" font-size="13">100 connections in the pool</text>

  <g class="bar">
    <rect x="90" y="46" width="81" height="26" rx="2"/>
    <rect x="90" y="116" width="351" height="26" rx="2"/>
    <rect x="90" y="186" width="621" height="26" rx="2"/>
  </g>

  <g class="fg" font-size="13">
    <text x="90" y="40">2,000 requests/s · 10 ms per request</text>
    <text x="90" y="110">2,000 requests/s · 100 ms per request</text>
    <text x="90" y="180">200,000 requests/s · 10 ms per request</text>
  </g>

  <g class="value" font-size="14">
    <text x="179" y="64">20 in flight</text>
    <text x="449" y="134">200 in flight</text>
    <text x="719" y="204">2,000 in flight</text>
  </g>

  <line x1="90" y1="250" x2="880" y2="250" class="axis" stroke-width="1"/>
  <g class="muted" font-size="12">
    <text x="90" y="268" text-anchor="middle">10</text>
    <text x="360" y="268" text-anchor="middle">100</text>
    <text x="630" y="268" text-anchor="middle">1,000</text>
    <text x="90" y="290" text-anchor="start">log scale · connections held at one instant = requests/s × seconds per request</text>
  </g>
</svg>
